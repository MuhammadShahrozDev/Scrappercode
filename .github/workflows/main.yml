name: smart_scraper Scraper Pipeline

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Unique run id"
        required: true
        default: "manual-test-1"

      target:
        description: "Target new leads"
        required: true
        default: "5"

      batch:
        description: "Batch size"
        required: true
        default: "5"

      max_runtime:
        description: "Maximum runtime in minutes"
        required: true
        default: "10"

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 190

    env:
      SMART_SCRAPER_API_URL: ${{ secrets.SMART_SCRAPER_API_URL }}
      SMART_SCRAPER_INGEST_TOKEN: ${{ secrets.SMART_SCRAPER_INGEST_TOKEN }}

      SMART_SCRAPER_RUN_ID: ${{ github.event.inputs.run_id }}
      SMART_SCRAPER_TARGET: ${{ github.event.inputs.target }}
      SMART_SCRAPER_BATCH_SIZE: ${{ github.event.inputs.batch }}
      SMART_SCRAPER_MAX_RUNTIME: ${{ github.event.inputs.max_runtime }}

      LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Run smart_scraper
        run: python main.py